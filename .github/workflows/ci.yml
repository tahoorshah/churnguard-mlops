name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data
          curl -L -o data/churn.csv https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv

      - name: Train model (produces artifact for tests)
        run: python src/train.py

      - name: Run tests
        run: pytest -q

      - name: Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r src/ -ll

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t churnguard:ci .

      - name: Trivy (image vulnerability scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: churnguard:ci
          severity: HIGH,CRITICAL
          exit-code: "0"
