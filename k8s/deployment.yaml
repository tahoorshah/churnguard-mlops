apiVersion: apps/v1
kind: Deployment
metadata:
  name: churnguard
  labels:
    app: churnguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churnguard
  template:
    metadata:
      labels:
        app: churnguard
    spec:
      containers:
        - name: churnguard
          image: 654654477638.dkr.ecr.us-east-1.amazonaws.com/churnguard:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
