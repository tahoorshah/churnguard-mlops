apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: churnguard
  namespace: monitoring
  labels:
    release: kps
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: churnguard
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
